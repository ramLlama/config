##################
# global Options #
##################
set -g default-terminal 'xterm-ghostty'
set -as terminal-features ',xterm-ghostty:RGB'
set -as terminal-overrides ',xterm-ghostty:Ms=\E]52;%p1%s;%p2%s\007'

# pass "Ptmux;" escape sequences through to the terminal
set -g allow-passthrough on

# allow other commands to set clipboard
set -s set-clipboard on

# report terminal focus in/out to apps (Emacs auto-revert, vim autoread, etc.)
set -g focus-events on

# Large scrollback buffer
set -g history-limit 100000

# Relax!
set -s escape-time 0
set -g repeat-time 600

# Less stretching to get to the first item.
set -g base-index 1
setw -g pane-base-index 1

# Activity
setw -g monitor-activity on
set -g visual-activity off

# Autorename sanely.
setw -g automatic-rename on

# Mouse toggle
bind M \
     set-option -g mouse on \;\
     display 'Mouse: On'

bind m \
     set-option -g mouse off \;\
     display 'Mouse: Off'

###############
# Keybindings #
###############

# remap prefix to Control + l
set -g prefix C-l
unbind C-b
bind C-l send-prefix

# reload the config.
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# splitting.
bind v split-window -h
bind h split-window -v

# pane movement
bind j select-pane -L
bind k select-pane -D
bind i select-pane -U
bind l select-pane -R

# pane resizing
bind -r Left  resize-pane -L 2
bind -r Down  resize-pane -D 2
bind -r Up    resize-pane -U 2
bind -r Right resize-pane -R 2

# window movement
bind -n C-S-Left swap-window -t -1\; select-window -t -1
bind -n C-S-Right swap-window -t +1\; select-window -t +1

# window name management
bind C new-window \; command-prompt "rename-window '%%'"
bind c new-window
bind , command-prompt "rename-window '%%'"

# clock
set-window-option -g clock-mode-colour green

###################################
# Color and Format Customizations #
###################################

# Status bar layout
set -g status-left-length 32
set -g status-right-length 150
set -g status-interval 5

# Status Line
set -g status-style bg=black,fg=yellow,default
set -g status-left '#[fg=black]#[bg=cyan] #S #[fg=cyan]#[bg=default]▙#[default] '
set -g status-right '#[fg=blue]▟#[fg=black]#[bg=blue] #h #[fg=green]▟#[fg=black]#[bg=green] %H:%M %b %e, %G '

# Window Entries
set-window-option -g window-status-format '[ #I: #W#F#{?pane_synchronized, <~>, <#{pane_index}>} ]'
set-window-option -g window-status-current-format '> #I: #W#F#{?pane_synchronized, <~>, <#{pane_index}>} <'
